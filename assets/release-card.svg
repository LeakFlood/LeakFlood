<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="280" viewBox="0 0 1400 280" role="img" aria-labelledby="releaseTitle">
  <title id="releaseTitle">Release philosophy</title>
  <defs>
    <linearGradient id="releaseBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#0b2533"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="280" rx="26" fill="url(#releaseBg)"/>
  <rect x="1" y="1" width="1398" height="278" rx="25" fill="none" stroke="#164e63" stroke-width="2"/>

  <rect x="54" y="52" width="10" height="48" rx="5" fill="#22d3ee"/>

  <text x="84" y="88"
        fill="#22d3ee"
        font-size="28"
        letter-spacing="3"
        font-weight="700"
        font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">RELEASE PHILOSOPHY</text>

  <text x="54" y="168"
        fill="#e2e8f0"
        font-size="42"
        font-weight="600"
        font-family="Inter, Arial, Helvetica, sans-serif">Open when the foundations are ready.</text>

  <text x="54" y="230"
        fill="#94a3b8"
        font-size="28"
        font-family="Inter, Arial, Helvetica, sans-serif">Not for activity. Not for visibility. For usefulness.</text>
</svg>
