<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">LeakFlood</title>
  <desc id="desc">Open tools for user-controlled systems</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#164e63" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="26" fill="url(#grid)"/>
  <rect width="1400" height="360" rx="26" fill="url(#glow)"/>

  <g stroke="#22d3ee" stroke-opacity=".45" fill="none">
    <path d="M1040 80 C1130 80 1160 145 1245 145"/>
    <path d="M1040 180 C1145 180 1180 245 1280 245"/>
    <path d="M960 250 C1060 250 1090 305 1190 305"/>
  </g>

  <g fill="#22d3ee" filter="url(#softGlow)">
    <circle cx="1038" cy="80" r="5"/>
    <circle cx="1245" cy="145" r="5"/>
    <circle cx="1038" cy="180" r="5"/>
    <circle cx="1280" cy="245" r="5"/>
    <circle cx="958" cy="250" r="5"/>
    <circle cx="1190" cy="305" r="5"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="70" y="72" fill="#67e8f9" font-size="18" letter-spacing="2">LF/PROFILE · PUBLIC NODE · VERSION 01</text>
    <text x="70" y="175" fill="#e2e8f0" font-size="72" font-weight="700" letter-spacing="5">LEAKFLOOD</text>
    <text x="73" y="222" fill="#94a3b8" font-size="24">open tools for user-controlled systems</text>

    <g font-size="16" fill="#67e8f9">
      <text x="74" y="292">LOCAL-FIRST</text>
      <text x="236" y="292">OPEN SOURCE</text>
      <text x="404" y="292">PRIVACY BY DESIGN</text>
      <text x="646" y="292">HUMAN-CENTERED</text>
    </g>

    <g font-size="14" fill="#64748b">
      <text x="1080" y="62">DEVICE_A</text>
      <text x="1240" y="130">DEVICE_B</text>
      <text x="1078" y="162">LOCAL_DATA</text>
      <text x="1272" y="232">OPEN_PROTOCOL</text>
      <text x="998" y="236">USER_CONTROL</text>
    </g>
  </g>

  <rect x="1" y="1" width="1398" height="358" rx="25" fill="none" stroke="#164e63" stroke-width="2"/>
</svg>
